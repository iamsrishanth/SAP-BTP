_schema-version: 3.3.0
ID: sap-btp-it-asset-lifecycle
version: 1.0.0
description: "SAP CAP and SAPUI5 IT Asset Lifecycle Management capstone"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - npm run copy:ui
modules:
  - name: sap-btp-it-asset-lifecycle-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: sap-btp-it-asset-lifecycle-auth
      - name: sap-btp-it-asset-lifecycle-db

  - name: sap-btp-it-asset-lifecycle-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: sap-btp-it-asset-lifecycle-db
  - name: sap-btp-it-asset-lifecycle
    type: approuter.nodejs
    path: .deploy/app-router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: sap-btp-it-asset-lifecycle-auth
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: sap-btp-it-asset-lifecycle-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sap-btp-it-asset-lifecycle-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'ITAdmin (sap-btp-it-asset-lifecycle ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.ITAdmin'
          - name: 'ComplianceManager (sap-btp-it-asset-lifecycle ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.ComplianceManager'
          - name: 'Employee (sap-btp-it-asset-lifecycle ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Employee'
    requires:
      - name: app-api
  - name: sap-btp-it-asset-lifecycle-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
